<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0d4b57">
    <meta name="apple-mobile-web-app-title" content="Aquarium Log">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Freshwater Log</title>
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="apple-touch-icon" href="./apple-touch-icon.png">
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
    <link rel="apple-touch-icon-precomposed" href="./apple-touch-icon-precomposed.png">
    <link rel="icon" type="image/png" sizes="192x192" href="./favicon.png">
    <link rel="icon" type="image/png" sizes="512x512" href="./assets/icon-512.png">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Freshwater</p>
          <h1>Aquarium Log</h1>
        </div>
        <div class="header-actions">
          <button class="icon-button" id="hardUpdate" type="button" aria-label="Hard update from GitHub" title="Hard update from GitHub">
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M21 12a9 9 0 0 1-15.4 6.4M3 12A9 9 0 0 1 18.4 5.6M18 2v4h-4M6 22v-4h4"/></svg>
          </button>
          <button class="icon-button" id="importData" type="button" aria-label="Import data" title="Import data">
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 21V9m0 0-4 4m4-4 4 4M5 5h14"/></svg>
          </button>
          <button class="icon-button" id="exportData" type="button" aria-label="Export data" title="Export data">
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 3v12m0 0 4-4m-4 4-4-4M5 19h14"/></svg>
          </button>
        </div>
      </header>

      <main>
        <section class="hero-panel" aria-label="Aquarium status">
          <canvas id="waterScene" width="740" height="110" aria-hidden="true"></canvas>
          <div class="status-strip">
            <div>
              <span class="status-label">Latest</span>
              <strong id="latestSummary">No readings</strong>
            </div>
            <div>
              <span class="status-label">Parameters</span>
              <strong id="parameterCount">0</strong>
            </div>
            <div>
              <span class="status-label">Water change</span>
              <strong id="lastWaterChange">&mdash;</strong>
            </div>
          </div>
        </section>

        <nav class="tabs" aria-label="Views">
          <button class="tab active" type="button" data-tab="log">Log</button>
          <button class="tab" type="button" data-tab="timeline">Timeline</button>
          <button class="tab" type="button" data-tab="notes">Notes</button>
        </nav>

        <section class="view active" id="logView">
          <div class="panel stack" id="timerPanel">
            <div class="section-heading">
              <h2>Test timers</h2>
              <label class="timer-minutes">
                <span>Min</span>
                <input id="timerMinutes" type="number" inputmode="decimal" value="5" min="0.5" max="120" step="0.5">
              </label>
            </div>
            <div class="timer-buttons" id="timerButtons"></div>
            <div class="timer-list" id="timerList"></div>
          </div>

          <form class="panel stack" id="readingForm">
            <div class="section-heading">
              <h2>Reading</h2>
              <div class="heading-buttons">
                <button class="text-button ghost" id="cancelReadingEdit" type="button" hidden>Cancel</button>
                <button class="text-button" id="saveReadingButton" type="submit">Save</button>
              </div>
            </div>
            <div class="field-row">
              <label>
                <span>Date</span>
                <input id="readingDate" type="date" required>
              </label>
              <label>
                <span>Time</span>
                <input id="readingTime" type="time">
              </label>
            </div>
            <div class="reading-grid" id="readingInputs"></div>
          </form>

          <div class="panel stack">
            <div class="section-heading">
              <h2>Parameters</h2>
            </div>
            <div class="parameter-list" id="parameterList"></div>
          </div>

          <form class="panel stack" id="parameterForm" autocomplete="off">
            <div class="section-heading">
              <h2>New parameter</h2>
              <button class="text-button" type="submit">Add</button>
            </div>
            <label>
              <span>Name</span>
              <input id="paramName" autocomplete="off" placeholder="Ammonia" required>
            </label>
            <div class="field-row">
              <label>
                <span>Low</span>
                <input id="paramLow" inputmode="decimal" type="number" step="any" placeholder="0">
              </label>
              <label>
                <span>High</span>
                <input id="paramHigh" inputmode="decimal" type="number" step="any" placeholder="0.25">
              </label>
            </div>
            <label>
              <span>Units</span>
              <input id="paramUnit" autocomplete="off" placeholder="ppm">
            </label>
          </form>
        </section>

        <section class="view" id="timelineView">
          <div class="panel">
            <div class="section-heading padded">
              <h2>Parameters</h2>
              <span class="hint">Tap a row for its trend</span>
            </div>
            <div class="table-wrap">
              <table class="summary-table">
                <thead>
                  <tr>
                    <th>Parameter</th>
                    <th>Latest</th>
                    <th>Status</th>
                    <th>Trend</th>
                  </tr>
                </thead>
                <tbody id="parameterSummaryTable"></tbody>
              </table>
            </div>
          </div>

          <form class="panel stack" id="eventForm">
            <div class="section-heading">
              <h2>Event</h2>
              <div class="heading-buttons">
                <button class="text-button ghost" id="cancelEventEdit" type="button" hidden>Cancel</button>
                <button class="text-button" id="eventSubmitButton" type="submit">Add</button>
              </div>
            </div>
            <label>
              <span>Type</span>
              <select id="eventType">
                <option value="waterChange">Water change</option>
                <option value="dosing">Dosing (GH/KH/ferts)</option>
                <option value="feeding">Feeding</option>
                <option value="maintenance">Maintenance</option>
                <option value="other">Other</option>
              </select>
            </label>
            <div class="field-row">
              <label>
                <span>Date</span>
                <input id="eventDate" type="date" required>
              </label>
              <label>
                <span>Time</span>
                <input id="eventTime" type="time">
              </label>
            </div>
            <label>
              <span>Title</span>
              <input id="eventTitle" autocomplete="off" placeholder="Water change" required>
            </label>
            <label>
              <span>Details</span>
              <textarea id="eventDetails" rows="3" placeholder="50% change, cleaned filter"></textarea>
            </label>
          </form>

          <div class="panel">
            <div class="section-heading padded">
              <h2>Timeline</h2>
              <button class="icon-button danger" id="resetTimeline" type="button" aria-label="Delete entire timeline" title="Delete entire timeline">
                <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2m-9 0 1 14h8l1-14"/></svg>
              </button>
            </div>
            <ol class="timeline" id="timelineList"></ol>
          </div>
        </section>

        <section class="view" id="notesView">
          <div class="panel stack">
            <div class="section-heading">
              <h2>Notes</h2>
              <span id="notesSaved" class="save-state">Saved</span>
            </div>
            <textarea id="notesArea" class="notes-area" rows="14" placeholder="Observations, feeding changes, fish behavior"></textarea>
          </div>
        </section>
      </main>
    </div>

    <div class="toast" id="toast" hidden>
      <span id="toastMessage"></span>
      <button id="toastUndo" type="button">Undo</button>
    </div>

    <input type="file" id="importFile" accept=".json,application/json" hidden>

    <script src="app.js"></script>
  </body>
</html>
